<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    /* CSS Riêng cho Module này */
    .msds-tab-active { border-bottom: 2px solid #059669; color: #059669; font-weight: 600; }
    .msds-tab-inactive { color: #6b7280; }
    .msds-log-item { font-size: 11px; padding: 4px 0; border-bottom: 1px dashed #eee; }
    
    /* CSS cho thanh cuộn đẹp hơn */
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f1f1; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col font-sans select-none">

  <div class="bg-slate-800 text-white p-4 shadow-md flex justify-between items-center shrink-0">
    <div class="flex items-center gap-2">
       <i class="ph-fill ph-file-pdf text-yellow-400 text-xl"></i>
       <h2 class="font-bold">Tạo MSDS Tự Động</h2>
    </div>
    <button onclick="window.goBack ? window.goBack() : google.script.run.loadDataFromSheet()" class="text-gray-400 hover:text-white"><i class="ph-bold ph-x text-xl"></i></button>
  </div>

  <div class="flex bg-white border-b border-gray-200 shrink-0">
    <button onclick="switchMsdsMode('CUSTOM')" id="tab-CUSTOM" class="flex-1 py-3 text-sm msds-tab-active">Tùy Chọn (Custom)</button>
    <button onclick="switchMsdsMode('BATCH')" id="tab-BATCH" class="flex-1 py-3 text-sm msds-tab-inactive">Tất Cả (Batch)</button>
  </div>

  <div class="p-4 flex-1 overflow-hidden flex flex-col">
    
    <div id="view-CUSTOM" class="flex flex-col h-full space-y-3">
       
       <div id="selection-area" class="flex flex-col h-full space-y-3">
          
          <button onclick="runSelectedGen()" id="btn-custom-run" class="w-full py-3 bg-emerald-600 text-white rounded-xl font-bold shadow-lg active:scale-95 transition shrink-0 flex items-center justify-center gap-2">
             <i class="ph-bold ph-play"></i> Tạo File Đã Chọn
          </button>

          <div class="bg-white p-3 rounded-xl shadow-sm border border-gray-100 flex flex-col flex-1 overflow-hidden">
             
             <div class="flex justify-between items-center mb-2 pb-2 border-b border-gray-100 shrink-0">
                <div class="flex items-center gap-2">
                   <input type="checkbox" id="chk-all" onchange="toggleSelectAll(this)" class="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500">
                   <label for="chk-all" class="text-xs font-bold text-gray-500 uppercase cursor-pointer">Chọn tất cả</label>
                </div>
                <input type="text" id="search-box" onkeyup="filterList()" placeholder="Tìm nhanh..." class="text-xs p-1 border rounded bg-gray-50 outline-none focus:ring-1 focus:ring-emerald-500 w-24">
             </div>

             <div id="checklist-container" class="flex-1 overflow-y-auto custom-scroll space-y-1 pr-1">
                <div class="text-center text-xs text-gray-400 mt-4">Đang tải danh sách...</div>
             </div>
          </div>

       </div>

       <div id="custom-log-area" class="hidden flex flex-col h-full bg-white rounded-xl shadow-sm border border-gray-100">
          <div class="p-3 border-b bg-emerald-50 flex justify-between items-center rounded-t-xl">
             <span class="text-sm font-bold text-emerald-800">Tiến độ xử lý</span>
             <span class="text-xs font-bold bg-white px-2 py-1 rounded text-emerald-600 border border-emerald-200">
                <span id="custom-done">0</span> / <span id="custom-total">0</span>
             </span>
          </div>
          <div id="custom-log" class="flex-1 overflow-y-auto p-3 font-mono text-xs space-y-2 custom-scroll">
             </div>
          <div class="p-3 border-t bg-gray-50 text-center">
             <button onclick="resetCustomView()" id="btn-custom-reset" class="hidden text-xs text-gray-500 underline hover:text-emerald-600">
                Quay lại danh sách
             </button>
             <span id="custom-processing-msg" class="text-xs text-gray-400 animate-pulse">Đang xử lý, vui lòng không tắt...</span>
          </div>
       </div>

    </div>

    <div id="view-BATCH" class="hidden h-full flex flex-col space-y-4">
       <div class="bg-blue-50 p-3 rounded-lg border border-blue-100 text-xs text-blue-800 flex gap-2 shrink-0">
          <i class="ph-fill ph-info text-lg"></i>
          <div>Chế độ này sẽ chạy toàn bộ danh sách từ trên xuống dưới.</div>
       </div>
       
       <div class="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100 shrink-0">
          <div>
             <div class="text-xs text-gray-400">Tiến độ</div>
             <div class="font-bold text-lg text-slate-700"><span id="batch-done">0</span> / <span id="batch-total">0</span></div>
          </div>
          <button onclick="runBatchGen()" id="btn-batch" class="px-6 py-2 bg-orange-500 text-white rounded-lg font-bold shadow active:scale-95 transition">
             Bắt đầu chạy
          </button>
       </div>

       <div class="bg-white rounded-xl border border-gray-200 flex-1 flex flex-col overflow-hidden">
          <div class="p-2 border-b bg-gray-50 text-xs font-bold text-gray-500 shrink-0">Nhật ký xử lý</div>
          <div id="batch-log" class="flex-1 overflow-y-auto p-2 font-mono text-gray-600 space-y-1 custom-scroll">
             <div class="text-center text-gray-300 mt-10">Chưa có hoạt động</div>
          </div>
       </div>
    </div>

  </div>

  <script>
    var gMaterialList = [];
    var gProcessQueue = [];
    var gIsRunning = false;
    var gCurrentMode = ''; // 'CUSTOM' or 'BATCH'

    (function() {
        loadMaterialData();
    })();

    function loadMaterialData() {
        google.script.run
            .withSuccessHandler(function(list) {
                gMaterialList = list;
                renderChecklist();
                // Cập nhật số lượng cho tab Batch
                document.getElementById('batch-total').innerText = gMaterialList.length;
            })
            .withFailureHandler(function(err) {
                alert("Lỗi tải dữ liệu: " + err.message);
            })
            .getMaterialList();
    }

    // --- LOGIC GIAO DIỆN (UI) ---

    function switchMsdsMode(mode) {
       if(gIsRunning) {
          alert("Đang xử lý, vui lòng đợi xong!");
          return;
       }
       document.getElementById('view-CUSTOM').classList.toggle('hidden', mode !== 'CUSTOM');
       document.getElementById('view-BATCH').classList.toggle('hidden', mode !== 'BATCH');
       
       document.getElementById('tab-CUSTOM').className = mode === 'CUSTOM' ? 'flex-1 py-3 text-sm msds-tab-active' : 'flex-1 py-3 text-sm msds-tab-inactive';
       document.getElementById('tab-BATCH').className = mode === 'BATCH' ? 'flex-1 py-3 text-sm msds-tab-active' : 'flex-1 py-3 text-sm msds-tab-inactive';
    }

    function renderChecklist() {
       var container = document.getElementById('checklist-container');
       container.innerHTML = '';
       
       if (gMaterialList.length === 0) {
          container.innerHTML = '<div class="text-center text-xs text-gray-400 mt-4">Không có dữ liệu</div>';
          return;
       }

       gMaterialList.forEach(function(item, idx) {
          var div = document.createElement('div');
          div.className = 'flex items-center gap-2 p-2 hover:bg-gray-50 rounded border border-transparent hover:border-gray-100 transition item-row';
          div.innerHTML = `
             <input type="checkbox" id="mat-${idx}" value="${idx}" class="item-chk w-4 h-4 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500 cursor-pointer">
             <label for="mat-${idx}" class="text-sm text-gray-700 cursor-pointer flex-1 select-none truncate">${item.name}</label>
          `;
          container.appendChild(div);
       });
    }

    function toggleSelectAll(source) {
       var checkboxes = document.querySelectorAll('.item-chk'); 
       var rows = document.querySelectorAll('.item-row');
       
       for(var i=0; i<rows.length; i++) {
           if(!rows[i].classList.contains('hidden')) {
               var chk = rows[i].querySelector('.item-chk');
               if(chk) chk.checked = source.checked;
           }
       }
    }

    function filterList() {
       var text = document.getElementById('search-box').value.toLowerCase();
       var rows = document.querySelectorAll('.item-row');
       rows.forEach(function(row) {
          var label = row.querySelector('label').innerText.toLowerCase();
          if (label.includes(text)) {
             row.classList.remove('hidden');
          } else {
             row.classList.add('hidden');
          }
       });
    }

    function resetCustomView() {
       document.getElementById('selection-area').classList.remove('hidden');
       document.getElementById('custom-log-area').classList.add('hidden');
       document.getElementById('custom-log').innerHTML = '';
       document.getElementById('btn-custom-reset').classList.add('hidden');
       document.getElementById('custom-processing-msg').classList.remove('hidden');
    }

    // --- LOGIC XỬ LÝ (CORE) ---

    function runSelectedGen() {
       var checkedBoxes = document.querySelectorAll('.item-chk:checked');
       if (checkedBoxes.length === 0) {
          alert("Vui lòng chọn ít nhất 1 mục!");
          return;
       }

       gProcessQueue = [];
       checkedBoxes.forEach(function(box) {
           var idx = parseInt(box.value);
           gProcessQueue.push(gMaterialList[idx]);
       });

       gCurrentMode = 'CUSTOM';
       document.getElementById('selection-area').classList.add('hidden');
       document.getElementById('custom-log-area').classList.remove('hidden');
       document.getElementById('custom-total').innerText = gProcessQueue.length;
       document.getElementById('custom-done').innerText = '0';
       
       startQueue();
    }

    function runBatchGen() {
       if(gIsRunning) return;
       
       var confirmRun = confirm("Bạn có chắc muốn tạo " + gMaterialList.length + " file không?");
       if(!confirmRun) return;

       gProcessQueue = [].concat(gMaterialList);
       
       gCurrentMode = 'BATCH';
       document.getElementById('btn-batch').innerText = "Đang chạy...";
       document.getElementById('btn-batch').classList.add('opacity-50', 'cursor-not-allowed');
       document.getElementById('batch-log').innerHTML = '';
       
       startQueue();
    }

    function startQueue() {
       gIsRunning = true;
       processNextItem();
    }

    function processNextItem() {
       if (gProcessQueue.length === 0) {
          finishQueue();
          return;
       }

       var item = gProcessQueue.shift(); 
       updateProgressCount();
       logMsg(`⏳ Đang tạo: ${item.name}...`, "text-gray-500");

       google.script.run.withSuccessHandler(function(res) {
          if(res.success) {
             logMsg(`✅ Xong: ${item.name}`, "text-green-600 font-bold", res.url);
          } else {
             logMsg(`❌ Lỗi ${item.name}: ${res.message}`, "text-red-500 font-bold");
          }
          processNextItem();
       }).generateSingleMsds(item.rowIndex);
    }

    function finishQueue() {
       gIsRunning = false;
       logMsg("🏁 HOÀN TẤT QUÁ TRÌNH!", "text-blue-600 font-bold text-center bg-blue-50 py-2 rounded");
       
       if (gCurrentMode === 'BATCH') {
          document.getElementById('btn-batch').innerText = "Hoàn tất";
          document.getElementById('btn-batch').classList.remove('opacity-50', 'cursor-not-allowed');
       } else {
          document.getElementById('btn-custom-reset').classList.remove('hidden');
          document.getElementById('custom-processing-msg').classList.add('hidden');
       }
    }

    function updateProgressCount() {
       if (gCurrentMode === 'BATCH') {
          var total = gMaterialList.length;
          var done = total - gProcessQueue.length;
          document.getElementById('batch-done').innerText = done;
       } else {
          var totalEl = document.getElementById('custom-total');
          var doneEl = document.getElementById('custom-done');
          var total = parseInt(totalEl.innerText);
          var done = total - gProcessQueue.length;
          doneEl.innerText = done;
       }
    }

    function logMsg(msg, classes, linkUrl) {
       var div = document.createElement('div');
       div.className = "msds-log-item " + (classes || "text-gray-600");
       
       if (linkUrl) {
          div.innerHTML = `<span>${msg}</span> <a href="${linkUrl}" target="_blank" class="text-blue-500 underline ml-2">[Mở File]</a>`;
       } else {
          div.innerText = msg;
       }

       var containerId = (gCurrentMode === 'BATCH') ? 'batch-log' : 'custom-log';
       var container = document.getElementById(containerId);
       container.appendChild(div);
       container.scrollTop = container.scrollHeight;
    }
  </script>
</body>
</html>
