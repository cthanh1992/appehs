<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    /* --- CSS CORE --- */
    .tab-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .tab-item { display: inline-flex; align-items: center; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; color: #64748b; background: #f8fafc; border: 1px solid #e2e8f0; transition: all 0.2s; cursor: pointer; user-select: none; }
    .tab-item i { margin-right: 6px; font-size: 14px; }
    .tab-item.active { background: #059669; color: white; border-color: #059669; box-shadow: 0 2px 4px rgba(5, 150, 105, 0.2); transform: translateY(-1px); }
    
    .area-container { display: flex; flex-wrap: nowrap; gap: 6px; overflow-x: auto; padding-bottom: 4px; -ms-overflow-style: none; scrollbar-width: none; }
    .area-container::-webkit-scrollbar { display: none; }
    .area-btn { white-space: nowrap; flex-shrink: 0; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #64748b; background: white; border: 1px solid #e2e8f0; transition: all 0.2s; cursor: pointer; }
    .area-btn.active { background: #f97316; color: white; border-color: #f97316; box-shadow: 0 2px 4px rgba(249, 115, 22, 0.2); }

    .stat-card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; position: relative; overflow: hidden; cursor: pointer; transition: transform 0.1s; }
    .stat-card:active { transform: scale(0.98); background: #f8fafc; }
    .border-l-status { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
    
    /* Màu sắc trạng thái chi tiết */
    .status-pass .border-l-status { background: #10b981; }
    .status-fail .border-l-status { background: #ef4444; }
    .status-missing .border-l-status { background: #cbd5e1; }

    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 8px; }
    .card-location { font-size: 15px; font-weight: 700; color: #1e293b; line-height: 1.4; }
    .card-area { font-size: 12px; color: #64748b; font-weight: 500; display: flex; align-items: center; margin-top: 2px; }
    .divider { height: 1px; background: #f1f5f9; margin: 10px 0; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; }
    
    .inspector-info { display: flex; align-items: center; gap: 8px; }
    .inspector-avatar { width: 24px; height: 24px; background: #e2e8f0; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #64748b; font-size: 12px; }
    .inspector-name { font-size: 12px; font-weight: 600; color: #334155; }
    .check-time { font-size: 11px; color: #94a3b8; margin-top: 2px; }
    
    .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
    .badge-pass { background: #d1fae5; color: #047857; }
    .badge-fail { background: #fee2e2; color: #b91c1c; }
    .badge-missing { background: #f1f5f9; color: #64748b; }

    .time-btn { flex: 1; padding: 10px 0; border-radius: 10px; font-size: 11px; font-weight: 600; background: #f8fafc; color: #64748b; border: 1px solid transparent; }
    .time-btn.active { background: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.3s; backdrop-filter: blur(2px); }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-content-sheet { background: white; width: 100%; max-width: 600px; border-radius: 20px 20px 0 0; max-height: 85vh; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal-overlay.open .modal-content-sheet { transform: translateY(0); }
    .modal-header { padding: 16px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; }
    .modal-body { padding: 16px; overflow-y: auto; }
    .issue-item { background: #fef2f2; border: 1px solid #fee2e2; border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .issue-q { font-size: 13px; font-weight: 700; color: #7f1d1d; margin-bottom: 4px; }
    .modal-close-btn { background: #f1f5f9; border: none; width: 32px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #64748b; }
    
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans select-none overflow-hidden">

  <div class="h-screen flex flex-col p-4 max-w-2xl mx-auto">
    <div class="mb-4 flex-shrink-0">
      <div class="flex justify-between items-center mb-2 px-1">
        <label class="text-xs font-bold text-gray-400 uppercase tracking-wider">Phiếu kiểm tra</label>
        <div id="loading-tabs" class="text-[10px] text-emerald-600 animate-pulse font-bold">Đang tải...</div>
      </div>
      <div id="checklist-tabs" class="tab-container"></div>
      
      <div id="area-btns-wrapper" class="hidden mt-2">
        <div id="area-list" class="area-container"></div>
      </div>
    </div>

    <div class="flex-1 overflow-y-auto pr-1 pb-20 no-scrollbar">
      <div id="time-section" class="hidden mb-4">
        <div class="flex gap-1.5 bg-white p-1.5 rounded-xl shadow-sm border border-gray-100" id="time-btns-container"></div>
        
        <div id="picker-container" class="hidden mt-2 bg-white p-3 rounded-xl shadow-sm border border-gray-100">
            <div id="picker-date" class="hidden flex items-center gap-2">
                <span class="text-[10px] text-gray-500 font-medium whitespace-nowrap">Chọn ngày:</span>
                <input type="date" id="inp-date" class="w-full p-1.5 border rounded text-xs bg-gray-50" onchange="loadData('DATE')">
            </div>
            <div id="picker-week" class="hidden flex items-center gap-2">
                <span class="text-[10px] text-gray-500 font-medium whitespace-nowrap">Tuần chứa ngày:</span>
                <input type="date" id="inp-week" class="w-full p-1.5 border rounded text-xs bg-gray-50" onchange="loadData('WEEK')">
            </div>
            <div id="picker-month" class="hidden flex items-center gap-2">
                <span class="text-[10px] text-gray-500 font-medium whitespace-nowrap">Chọn tháng:</span>
                <input type="month" id="inp-month" class="w-full p-1.5 border rounded text-xs bg-gray-50" onchange="loadData('MONTH')">
            </div>
            <div id="picker-custom" class="hidden">
                <div class="flex gap-2 mb-2">
                    <div class="w-1/2"><span class="text-[10px] text-gray-400">Từ</span><input type="date" id="d-start" class="w-full p-1.5 border rounded text-xs bg-gray-50"></div>
                    <div class="w-1/2"><span class="text-[10px] text-gray-400">Đến</span><input type="date" id="d-end" class="w-full p-1.5 border rounded text-xs bg-gray-50"></div>
                </div>
                <button onclick="loadData('CUSTOM')" class="w-full py-2 bg-emerald-600 text-white rounded-lg font-bold text-xs shadow">Xác nhận</button>
            </div>
        </div>
      </div>

      <div id="result-list" class="space-y-3"></div>
    </div>
  </div>

  <div id="detail-modal" class="modal-overlay" onclick="closeModal()">
    <div class="modal-content-sheet" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <div id="m-location" class="text-sm font-bold text-gray-800">Thông tin</div>
          <div id="m-time" class="text-xs text-gray-500">...</div>
        </div>
        <button class="modal-close-btn" onclick="closeModal()"><i class="ph ph-x"></i></button>
      </div>
      <div class="modal-body" id="m-body"></div>
    </div>
  </div>

  <script>
    var gStatsMenuData = [];
    var gStatsCurrentChecklistId = null;
    var gStatsHistoryData = []; 
    var gCurrentTimeType = 'DATE'; 
    var gCurrentArea = 'ALL';

    // Khởi động: Lấy danh sách menu
    google.script.run
      .withSuccessHandler(renderTabs)
      .getMenuData();

    function renderTabs(json) {
      document.getElementById('loading-tabs').classList.add('hidden');
      try { gStatsMenuData = JSON.parse(json); } catch (e) { return; }
      
      var container = document.getElementById('checklist-tabs');
      container.innerHTML = '';
      
      var list = gStatsMenuData.filter(function(i) { return i.type === 'LINK' && i.action === 'OPEN_CHECKLIST'; });
      list.forEach(function(item, index) {
        var btn = document.createElement('div');
        btn.className = 'tab-item';
        
        // Rút gọn tên hiển thị
        var shortName = item.name.replace('Kiểm tra EHS ', '').replace('Kiểm tra ', '');
        var iconClass = item.icon ? 'ph-' + item.icon : 'ph-clipboard-text';
        
        btn.innerHTML = '<i class="ph ' + iconClass + '"></i>' + shortName;
        btn.onclick = function() { onTabClick(item.id, btn); };
        container.appendChild(btn);
        if(index === 0) btn.click();
      });
    }

    function onTabClick(id, btnElement) {
      gStatsCurrentChecklistId = id;
      gCurrentArea = 'ALL';
      document.querySelectorAll('.tab-item').forEach(function(b) { b.classList.remove('active'); });
      btnElement.classList.add('active');
      
      loadAreaButtons(id);
      
      var item = gStatsMenuData.find(function(i) { return i.id === id; });
      var freq = 'DAILY';
      if (item && item.note) {
          if (item.note.includes('WEEKLY')) freq = 'WEEKLY';
          else if (item.note.includes('MONTHLY')) freq = 'MONTHLY';
      }
      renderTimeButtons(freq);
    }

    function loadAreaButtons(checklistId) {
      var container = document.getElementById('area-list');
      var wrapper = document.getElementById('area-btns-wrapper');
      wrapper.classList.remove('hidden');
      container.innerHTML = '<div class="area-btn">Đang tải...</div>';

      google.script.run.withSuccessHandler(function(areas) {
          container.innerHTML = '';
          var allBtn = document.createElement('div');
          allBtn.className = 'area-btn active';
          allBtn.innerText = 'Tất cả';
          allBtn.onclick = function() { onAreaClick('ALL', allBtn); };
          container.appendChild(allBtn);

          if (areas && areas.length > 0) {
              areas.forEach(function(area) {
                  var btn = document.createElement('div');
                  btn.className = 'area-btn';
                  btn.innerText = area;
                  btn.onclick = function() { onAreaClick(area, btn); };
                  container.appendChild(btn);
              });
          }
      }).getChecklistAreas(checklistId);
    }

    function onAreaClick(areaVal, btnElement) {
      gCurrentArea = areaVal;
      document.querySelectorAll('.area-btn').forEach(function(b) { b.classList.remove('active'); });
      btnElement.classList.add('active');
      loadData(gCurrentTimeType);
    }

    function renderTimeButtons(freq) {
      var container = document.getElementById('time-btns-container');
      document.getElementById('time-section').classList.remove('hidden');
      document.getElementById('picker-container').classList.add('hidden');

      var html = '<button onclick="selectTime(\'DATE\', this)" class="time-btn">Chọn ngày</button>';
      html += '<button onclick="selectTime(\'WEEK\', this)" class="time-btn">Tuần</button>';
      html += '<button onclick="selectTime(\'MONTH\', this)" class="time-btn">Tháng</button>';
      html += '<button onclick="selectTime(\'CUSTOM\', this)" class="time-btn">Tùy chọn</button>';
      container.innerHTML = html;
      
      var now = new Date();
      var yyyy = now.getFullYear();
      var mm = String(now.getMonth() + 1).padStart(2, '0');
      var dd = String(now.getDate()).padStart(2, '0');
      document.getElementById('inp-date').value = yyyy + '-' + mm + '-' + dd;
      document.getElementById('inp-week').value = yyyy + '-' + mm + '-' + dd;
      document.getElementById('inp-month').value = yyyy + '-' + mm;

      container.querySelector('button').click();
    }

    function selectTime(type, btn) {
        document.querySelectorAll('.time-btn').forEach(function(b) { b.classList.remove('active'); });
        if(btn) btn.classList.add('active');

        var pickerContainer = document.getElementById('picker-container');
        ['date','week','month','custom'].forEach(t => document.getElementById('picker-'+t).classList.add('hidden'));

        pickerContainer.classList.remove('hidden');
        document.getElementById('picker-' + type.toLowerCase()).classList.remove('hidden');
        if (type !== 'CUSTOM') loadData(type);
    }

    function loadData(type) {
      gCurrentTimeType = type;
      var resDiv = document.getElementById('result-list');
      resDiv.innerHTML = '<div class="h-24 bg-white rounded-xl animate-pulse"></div>';
      
      var s, e;
      if (type === 'DATE') {
         var d = document.getElementById('inp-date').value;
         if(!d) return; s = new Date(d); e = new Date(d);
      } else if (type === 'WEEK') {
         var d = new Date(document.getElementById('inp-week').value);
         var day = d.getDay(), diff = d.getDate() - day + (day == 0 ? -6:1);
         s = new Date(d.setDate(diff)); e = new Date(s); e.setDate(s.getDate() + 6);
      } else if (type === 'MONTH') {
         var m = document.getElementById('inp-month').value.split('-');
         s = new Date(m[0], m[1]-1, 1); e = new Date(m[0], m[1], 0);
      } else {
         s = new Date(document.getElementById('d-start').value);
         e = new Date(document.getElementById('d-end').value);
      }

      var timeParam = type + ',' + formatDate(s) + ',' + formatDate(e);
      google.script.run
        .withSuccessHandler(renderResults)
        .getTrackingStats(timeParam, gCurrentArea);
    }

    function formatDate(d) {
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function renderResults(json) {
      var resDiv = document.getElementById('result-list');
      try {
        var response = JSON.parse(json);
        var data = response[gStatsCurrentChecklistId];
        if (!data || data.rows.length === 0) {
            resDiv.innerHTML = '<div class="text-center py-10 text-gray-400 text-xs">Không có dữ liệu</div>';
            return;
        }

        var html = '';
        data.rows.forEach(function(item, idx) {
            if (data.viewMode === 'DETAIL') {
                var status = item.result; // PASS, FAIL, MISSING
                var sClass = status === 'PASS' ? 'status-pass' : (status === 'FAIL' ? 'status-fail' : 'status-missing');
                var bClass = status === 'PASS' ? 'badge-pass' : (status === 'FAIL' ? 'badge-fail' : 'badge-missing');
                var icon = status === 'PASS' ? 'ph-check-circle' : (status === 'FAIL' ? 'ph-warning-circle' : 'ph-minus-circle');
                
                html += '<div class="stat-card ' + sClass + '" onclick="openModal(' + idx + ')">' +
                        '<div class="border-l-status"></div>' +
                        '<div class="card-header">' +
                            '<div><div class="card-location">' + item.loc + '</div><div class="card-area"><i class="ph ph-map-pin"></i> ' + item.area + '</div></div>' +
                            '<div class="status-badge ' + bClass + '"><i class="ph ' + icon + '"></i> ' + status + '</div>' +
                        '</div>' +
                        '<div class="divider"></div>' +
                        '<div class="card-footer">' +
                            '<div class="inspector-info">' +
                                '<div class="inspector-avatar"><i class="ph ph-user"></i></div>' +
                                '<div><div class="inspector-name">' + item.inspector + '</div><div class="check-time">' + item.time + '</div></div>' +
                            '</div>' +
                            '<i class="ph ph-caret-right text-gray-300"></i>' +
                        '</div></div>';
            } else {
                var color = item.ratio >= 100 ? 'bg-emerald-500' : (item.ratio > 0 ? 'bg-orange-400' : 'bg-gray-300');
                html += '<div class="stat-card">' +
                        '<div class="flex justify-between items-end mb-2">' +
                            '<div><div class="card-location">' + item.loc + '</div><div class="card-area">' + item.area + '</div></div>' +
                            '<div class="text-xl font-bold">' + item.current + '<span class="text-xs text-gray-400">/' + item.target + '</span></div>' +
                        '</div>' +
                        '<div class="w-full bg-gray-100 rounded-full h-2">' +
                            '<div class="' + color + ' h-2 rounded-full" style="width:' + Math.min(item.ratio, 100) + '%"></div>' +
                        '</div></div>';
            }
        });
        resDiv.innerHTML = html;
        gStatsHistoryData = data.rows;
      } catch(e) { resDiv.innerHTML = 'Lỗi hiển thị'; }
    }

    function openModal(idx) {
      var item = gStatsHistoryData[idx];
      if (!item || item.result === 'MISSING') return;
      document.getElementById('m-location').innerText = item.loc;
      document.getElementById('m-time').innerText = item.time + ' - ' + item.inspector;
      var body = document.getElementById('m-body');
      
      if (!item.issues || item.issues.length === 0) {
        body.innerHTML = '<div class="text-center py-6 text-emerald-600 font-bold">✓ Hoàn hảo, không có lỗi</div>';
      } else {
        var h = '';
        item.issues.forEach(iss => {
            h += '<div class="issue-item"><div class="issue-q">' + iss.question + '</div>' +
                 '<div class="text-xs text-red-600 font-bold">KQ: ' + iss.value + '</div>';
            if(iss.note) h += '<div class="text-xs text-gray-500 mt-1 italic">Ghi chú: ' + iss.note + '</div>';
            h += '</div>';
        });
        body.innerHTML = h;
      }
      document.getElementById('detail-modal').classList.add('open');
    }

    function closeModal() { document.getElementById('detail-modal').classList.remove('open'); }
  </script>
</body>
</html>
